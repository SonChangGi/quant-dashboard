interface:
  display_name: "Quant Goal"
  short_description: "Finish explicit goals with repeated proof"
  default_prompt: "Use $quant-goal to turn the explicitly approved objective into durable checkpoints, implement it through bounded stories, repeatedly audit contracts, data-to-public automation, cost authority, and user experience, repair defects, and finish only when the required evidence and approved release gates pass. Auto-renewing or free-to-paid trials, payment method registration, plan upgrades, paid overage or pay-as-you-go use, exceeding a verified free quota, paid add-ons, and Spend cap disablement are paid actions and are prohibited unless a direct prior user request names the exact bounded paid action; free-plan cost hard stops must remain enabled."
