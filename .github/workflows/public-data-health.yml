name: Public data health

on:
  schedule:
    # Runs after the last scheduled retry window across the linked dashboards.
    - cron: "15 5 * * 2-6"
  workflow_run:
    workflows: ["Platform Foundation"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: public-data-health
  cancel-in-progress: true

jobs:
  monitor:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the monitored main revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Inspect all public summary contracts
        id: health
        run: |
          set +e
          npm run test:live -- --report artifacts/public-data-health.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Restore the prior scheduled incident identity
        if: always() && github.event_name == 'schedule'
        id: previous_incident
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          artifact_id="$(timeout 30s gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=public-data-incident-state&per_page=10" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [[ -z "$artifact_id" ]]; then
            echo "No prior scheduled incident state is available."
            exit 0
          fi
          archive="$RUNNER_TEMP/public-data-incident-state.zip"
          timeout 60s gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$archive"
          unzip -p "$archive" public-data-incident-state.json \
            > artifacts/previous-public-data-incident-state.json
      - name: Classify stable incident identity
        if: always() && hashFiles('artifacts/public-data-health.json') != ''
        id: incident
        run: |
          args=(
            --report artifacts/public-data-health.json
            --output artifacts/public-data-incident-state.json
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ -f artifacts/previous-public-data-incident-state.json ]]; then
            args+=(--previous artifacts/previous-public-data-incident-state.json)
          fi
          node scripts/public-health-incident.mjs "${args[@]}"
      - name: Upload bounded public-health evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-data-health-${{ github.run_id }}
          path: artifacts/public-data-health.json
          if-no-files-found: error
          retention-days: 14
      - name: Save scheduled incident identity before notification gating
        if: always() && github.event_name == 'schedule' && hashFiles('artifacts/public-data-incident-state.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-data-incident-state
          path: artifacts/public-data-incident-state.json
          if-no-files-found: error
          retention-days: 30
      - name: Summarize health classification
        if: always()
        env:
          HEALTH_EXIT: ${{ steps.health.outputs.exit_code }}
        run: |
          echo "## Quant Dashboard public data health" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f artifacts/public-data-health.json ]]; then
            jq -r '"State: **\(.state)**  \nHealthy projects: \(.counts.healthyProjectCount)/\(.counts.projectCount)  \nHard findings: \(.counts.hardFindingCount)  \nTransient findings: \(.counts.transientFindingCount)"' artifacts/public-data-health.json >> "$GITHUB_STEP_SUMMARY"
            jq -r '.findings[]? | "- **\(.severity)** [\(.category)] \(.project): \(.message)"' artifacts/public-data-health.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$HEALTH_EXIT" == "2" ]]; then
            echo "::warning::Only one bounded transport incident or upstream degraded/stale operation warnings were observed."
          fi
      - name: Fail only public contract or broad observability regressions
        if: always()
        run: |
          node scripts/public-health-gate.mjs \
            --report artifacts/public-data-health.json \
            --health-exit "${{ steps.health.outputs.exit_code }}" \
            --event-name "${{ github.event_name }}" \
            --incident-changed "${{ steps.incident.outputs.changed }}"
