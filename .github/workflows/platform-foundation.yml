name: Platform Foundation

on:
  pull_request:
    paths:
      - "platform/**"
      - "assets/**"
      - "shared/**"
      - "docs/**"
      - "scripts/**"
      - "DESIGN.md"
      - "README.md"
      - "index.html"
      - "package.json"
      - ".github/workflows/platform-foundation.yml"
      - ".github/workflows/public-data-health.yml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "assets/**"
      - "shared/**"
      - "docs/**"
      - "scripts/**"
      - "DESIGN.md"
      - "README.md"
      - "index.html"
      - "package.json"
      - ".github/workflows/platform-foundation.yml"
      - ".github/workflows/public-data-health.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Validate Hub, design prompt, and static fallback
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate shared packages and reference builds
        run: pnpm run check

  control-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/services/control-api
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11.18"
      - name: Install pinned uv
        run: |
          python -m pip install --no-cache-dir --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install uv==0.13.4
      - name: Install locked API dependencies
        run: uv sync --locked --dev
      - name: Validate control API
        run: |
          uv run ruff check src tests scripts
          uv run pytest -q
      - name: Build locked control API image
        run: docker build --pull --no-cache --tag quant-control-api:test .
      - name: Verify image versions and real TLS rejection without credentials
        run: docker run --rm -i --entrypoint python quant-control-api:test < scripts/verify_image_tls.py
      - name: Smoke test non-root API image
        run: |
          container_id=$(docker run --detach quant-control-api:test)
          trap 'docker rm --force "$container_id" >/dev/null' EXIT
          for attempt in {1..15}; do
            if docker exec "$container_id" python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
