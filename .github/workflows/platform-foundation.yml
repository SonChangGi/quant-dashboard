name: Platform Foundation

on:
  pull_request:
    paths:
      - "platform/**"
      - "assets/**"
      - "docs/**"
      - "scripts/**"
      - "DESIGN.md"
      - "README.md"
      - "index.html"
      - "package.json"
      - ".github/workflows/platform-foundation.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "assets/**"
      - "docs/**"
      - "scripts/**"
      - "DESIGN.md"
      - "README.md"
      - "index.html"
      - "package.json"
      - ".github/workflows/platform-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate Hub, design prompt, and static fallback
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate shared packages and reference builds
        run: pnpm run check

  control-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/services/control-api
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      - name: Install pinned uv
        run: python -m pip install uv==0.11.17
      - name: Install locked API dependencies
        run: uv sync --locked --dev
      - name: Validate control API
        run: |
          uv run ruff check src tests
          uv run pytest -q
      - name: Build locked control API image
        run: docker build --tag quant-control-api:test .
