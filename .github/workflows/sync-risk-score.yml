name: Sync Risk Score public mirror

on:
  workflow_dispatch:
  schedule:
    # 08:30 through 18:30 KST Tue-Sat: pull after source windows and absorb scheduler delays.
    - cron: "30 23 * * 1-5"
    - cron: "30 1 * * 2-6"
    - cron: "30 3 * * 2-6"
    - cron: "30 5 * * 2-6"
    - cron: "30 7 * * 2-6"
    - cron: "30 9 * * 2-6"

permissions:
  contents: read

concurrency:
  group: quant-dashboard-risk-score-sync
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout canonical Risk Score source repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: SonChangGi/risk-score
          ref: main
          path: .source/risk-score

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Test and verify canonical source
        working-directory: .source/risk-score
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/verify_data_freshness.py
          npm test

      - name: Build and verify public mirror artifact
        run: |
          artifact_root="$RUNNER_TEMP/risk-score-artifact"
          payload="$artifact_root/payload"
          mkdir -p "$artifact_root"
          python3 .source/risk-score/scripts/sync_to_quant_dashboard.py --target "$payload"
          PYTHONDONTWRITEBYTECODE=1 python3 -B .source/risk-score/scripts/verify_quant_dashboard_sync.py --target "$payload"
          git -C .source/risk-score rev-parse HEAD > "$artifact_root/SOURCE_SHA"
          (
            cd "$payload"
            find . -type f -print0 | sort -z | xargs -0 sha256sum > "$artifact_root/SHA256SUMS"
          )

      - name: Upload verified public mirror artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-risk-score-mirror
          path: ${{ runner.temp }}/risk-score-artifact
          if-no-files-found: error
          retention-days: 1

  publish-mirror:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Quant Dashboard deploy repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Download verified public mirror artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-risk-score-mirror
          path: .verified-risk-score

      - name: Commit and push verified public mirror
        run: |
          artifact_root="$GITHUB_WORKSPACE/.verified-risk-score"
          payload="$artifact_root/payload"
          source_sha="$(cat "$artifact_root/SOURCE_SHA")"

          if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Risk Score source SHA in verified artifact." >&2
            exit 1
          fi
          if find "$payload" -type l -print -quit | grep -q .; then
            echo "Verified mirror artifact must not contain symbolic links." >&2
            exit 1
          fi
          (
            cd "$payload"
            sha256sum --check "$artifact_root/SHA256SUMS"
          )

          sync_verified_payload() {
            rm -rf "$GITHUB_WORKSPACE/risk-score"
            cp -R "$payload" "$GITHUB_WORKSPACE/risk-score"
            diff -qr "$payload" "$GITHUB_WORKSPACE/risk-score"
          }

          sync_verified_payload
          npm test

          if git diff --quiet -- risk-score; then
            echo "Risk Score public mirror already matches the canonical source."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risk-score
          git commit -m "Publish refreshed risk-score mirror" \
            -m "Source: SonChangGi/risk-score@${source_sha}" \
            -m "Constraint: Quant Dashboard owns public mirror publication without a cross-repository write token." \
            -m "Tested: risk-score freshness and mirror verifiers; quant-dashboard npm test" \
            -m "Confidence: high" \
            -m "Scope-risk: narrow"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing on the latest Quant Dashboard main."
            git fetch origin main
            git rebase origin/main
            sync_verified_payload
            npm test
            if ! git diff --quiet -- risk-score; then
              git add risk-score
              git commit --amend --no-edit
            fi
          done

          echo "Failed to publish the Risk Score mirror after three attempts." >&2
          exit 1
